name: moka
description: Moka — one app for both customers (post jobs, unlock provider tiers) and providers (browse jobs, pay to apply)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.5.0
  flutter_secure_storage: ^9.2.2
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  webview_flutter: ^4.9.0
  intl: ^0.19.0
  go_router: ^14.2.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
