name: Build Moka app (APK)

on:
  push:
    branches: ['**']
    paths:
      - 'app/**'
      - '.github/workflows/build-app.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend base URL the app should call'
        required: false
        default: 'http://10.0.2.2:4000/api'
      build_mode:
        description: 'APK build mode'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    env:
      API_BASE_URL: ${{ github.event.inputs.api_base_url || 'http://10.0.2.2:4000/api' }}
      BUILD_MODE: ${{ github.event.inputs.build_mode || 'debug' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.moka --project-name moka .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --"$BUILD_MODE" --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Locate built APK
        id: find_apk
        run: |
          APK_PATH=$(find build/app/outputs/flutter-apk -name "app-${BUILD_MODE}.apk" | head -n1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found"
            ls -R build/app/outputs || true
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: moka-app-${{ env.BUILD_MODE }}-${{ github.sha }}
          path: app/${{ steps.find_apk.outputs.path }}
          retention-days: 14
          if-no-files-found: error