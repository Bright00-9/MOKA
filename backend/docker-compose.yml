version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: moka
      POSTGRES_PASSWORD: moka
      POSTGRES_DB: moka
    ports:
      - "5432:5432"
    volumes:
      - moka_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moka"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://moka:moka@postgres:5432/moka
    ports:
      - "4000:4000"

volumes:
  moka_pgdata:
